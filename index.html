<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劇団四季 観劇・キャスト管理アプリ（クラウド版）</title>
    <!-- Firebase SDKの読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase設定（ご提示いただいた情報）
        const firebaseConfig = {
            apiKey: "AIzaSyB9OS_mGy9_4HDjw96Lm5e8jFNnc521NZs",
            authDomain: "my-drama-app-5ecbb.firebaseapp.com",
            projectId: "my-drama-app-5ecbb",
            storageBucket: "my-drama-app-5ecbb.appspot.com",
            messagingSenderId: "1084781881966",
            appId: "1:1084781881966:web:bd7f192d45af26e724d47f"
        };

        // 初期化
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // グローバル公開用
        window.appAuth = auth;
        window.appDb = db;
        window.appProvider = provider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.collection = collection;
        window.getDocs = getDocs;
        window.setDoc = setDoc;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.getDoc = getDoc;

        // 認証状態の監視
        onAuthStateChanged(auth, async (user) => {
            const loginOverlay = document.getElementById('login-overlay');
            const userNameSpan = document.getElementById('user-name');

            if (user) {
                loginOverlay.classList.add('hidden');
                userNameSpan.innerText = user.displayName || user.email;
                await loadCloudData();
                initApp();
            } else {
                loginOverlay.classList.remove('hidden');
            }
        });
    </script>

    <style>
        :root {
            --primary-color: #1b263b;
            --accent-color: #d4af37;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdde1;
            --danger-color: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; }
        header { background-color: var(--primary-color); color: white; padding: 15px; text-align: center; font-size: 1.1rem; font-weight: bold; border-bottom: 3px solid var(--accent-color); display: flex; justify-content: space-between; align-items: center; }
        header span { font-size: 0.8rem; font-weight: normal; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .hidden { display: none !important; }
        
        /* ログインオーバーレイ */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(27, 38, 59, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; color: white; text-align: center; padding: 20px; }
        #login-overlay h1 { margin-bottom: 15px; font-size: 1.5rem; color: var(--accent-color); }
        #login-overlay p { margin-bottom: 25px; font-size: 0.95rem; opacity: 0.8; }
        .google-login-btn { background: white; color: #333; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

        /* カード・フォーム */
        .card { background: var(--card-bg); border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; background: #fff; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; font-weight: bold; }
        button.accent { background-color: var(--accent-color); color: #1b263b; }
        button.small { padding: 6px 10px; font-size: 0.85rem; width: auto; }
        
        /* 下バナー（タブバー） */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
        .nav-item { text-align: center; font-size: 0.75rem; color: #777; cursor: pointer; flex: 1; }
        .nav-item.active { color: #1b263b; font-weight: bold; }
        .nav-item div { font-size: 1.2rem; margin-bottom: 2px; }

        /* リスト・詳細 */
        .list-item { padding: 10px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .detail-box { background: #fafbfc; border-left: 4px solid var(--accent-color); padding: 12px; margin-top: 8px; font-size: 0.9rem; border-radius: 0 6px 6px 0; }
        
        /* タグリスト */
        .item-tag-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .item-tag { display: flex; justify-content: space-between; align-items: center; background: #f1f2f6; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
        .delete-btn { background: var(--danger-color); color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 0.8rem; cursor: pointer; width: auto; }

        /* 検索フィルター */
        .search-filters { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-filters button { font-size: 0.8rem; padding: 6px; background: #e0e0e0; color: #333; font-weight: normal; }
        .search-filters button.active { background: var(--primary-color); color: white; font-weight: bold; }

        /* オートコンプリート */
        .cast-input-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; position: relative; }
        .autocomplete-wrapper { position: relative; flex: 1; }
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border-color); border-top: none; max-height: 150px; overflow-y: auto; z-index: 10; border-radius: 0 0 6px 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .suggestion-item { padding: 8px 10px; font-size: 0.9rem; cursor: pointer; border-bottom: 1px solid #f1f1f1; outline: none; }
        .suggestion-item:hover, .suggestion-item:focus { background: #eef2f7; color: var(--primary-color); font-weight: bold; }
    </style>
</head>

    <div id="login-overlay">
        <h1>劇団四季 観劇・キャスト管理</h1>
        <p>ご利用にはGoogleアカウントでのログインが必要です。<br>どの端末からでも同じデータにアクセスできます。</p>

            Googleアカウントでログイン
        </button>
    </div>

    <header>
        <div id="header-title">ホーム / 登録</div>
        <div>
            <span id="user-name"></span>
            <button onclick="logout()" class="small" style="background: #c0392b; margin-left: 8px; padding: 4px 8px; font-size: 0.75rem;">ログアウト</button>
        </div>
    </header>

    <div class="container">

        <div id="screen-home" class="screen">
            <div class="card">

                <form id="record-form" onsubmit="saveRecord(event)">

                        <label>観劇日</label>
                        <input type="date" id="rec-date" required>
                    </div>
                    <div class="form-group">
                        <label>作品名</label>
                        <select id="rec-work" onchange="onWorkSelected()" required></select>
                    </div>
                    <div class="form-group">
                        <label>劇場名</label>
                        <select id="rec-theater" required></select>
                    </div>
                    <div class="form-group">
                        <label>同行者</label>
                        <input type="text" id="rec-companion" placeholder="例：友人、家族など">

                    </div>

                    <button type="submit" class="accent">この内容で登録する</button>

            </div>
        </div>

                </div>
            </div>
        </div>

        <!-- ================= 3. キャスト一覧・編集画面 ================= -->
        <div id="screen-casts" class="screen hidden">
            <div class="card">
                <div class="search-filters">
                    <button class="active" onclick="setSearchFilter('all', this)">すべて</button>
                    <button onclick="setSearchFilter('name', this)">キャスト名</button>
                    <button onclick="setSearchFilter('work', this)">作品名</button>
                    <button onclick="setSearchFilter('role', this)">役名</button>
                </div>

            </div>
            <div class="card">

                <div id="cast-list-container"></div>
            </div>
        </div>

                <h3 style="color: var(--primary-color);">作品マスター設定</h3>
                <div class="form-group" style="margin-top: 10px;">
                    <input type="text" id="new-work-input" placeholder="作品名を入力してEnter" onkeydown="handleWorkKeydown(event)">
                    <button style="margin-top: 5px;" onclick="addMasterWork()">作品を追加</button>
                </div>
                <div id="work-tag-list" class="item-tag-list"></div>
            </div>

            <div class="card">
                <h3 style="color: var(--primary-color);">劇場マスター設定</h3>
                <div class="form-group" style="margin-top: 10px;">
                    <input type="text" id="new-theater-input" placeholder="劇場名を入力してEnter" onkeydown="handleTheaterKeydown(event)">

                </div>
                <div id="theater-tag-list" class="item-tag-list"></div>
            </div>

            <div class="card">

                <div class="form-group" style="margin-top: 10px;">
                    <label>対象作品</label>
                    <select id="role-target-work" onchange="renderRoleSettings()"></select>
                </div>
                <div class="form-group">
                    <input type="text" id="new-role-input" placeholder="役名を入力" onkeydown="handleRoleKeydown(event)">
                    <button style="margin-top: 5px;" onclick="addMasterRole()">役名を追加</button>
                </div>

            </div>
        </div>

    </div>

        // ログイン処理
        async function loginWithGoogle() {
            try {
                await window.signInWithPopup(window.appAuth, window.appProvider);
            } catch (error) {
                console.error("ログインエラー:", error);
                alert("ログインに失敗しました: " + error.message);

        async function logout() {
            await window.signOut(window.appAuth);
        }

        // Firestoreからクラウドデータを読み込む（初回はデフォルトデータを自動保存）
        async function loadCloudData() {
            const user = window.appAuth.currentUser;
            if (!user) return;

            const db = window.appDb;
            const uid = user.uid;

            try {
                // マスター・設定データの読み込み
                const settingsDoc = await window.getDoc(window.doc(db, "users", uid, "config", "master"));
                if (settingsDoc.exists()) {
                    const data = settingsDoc.data();
                    masterWorks = data.works || defaultWorks;
                    masterTheaters = data.theaters || defaultTheaters;
                    masterRoles = data.roles || defaultRoles;
                } else {
                    masterWorks = [...defaultWorks];
                    masterTheaters = [...defaultTheaters];
                    masterRoles = JSON.parse(JSON.stringify(defaultRoles));
                    await saveMasterToCloud();
                }

                // キャストデータの読み込み
                const castsSnap = await window.getDocs(window.collection(db, "users", uid, "casts"));
                if (!castsSnap.empty) {
                    castsData = [];
                    castsSnap.forEach(d => castsData.push({ id: d.id, ...d.data() }));
                } else {
                    castsData = JSON.parse(JSON.stringify(defaultCasts));
                    for (const c of castsData) {
                        await window.setDoc(window.doc(db, "users", uid, "casts", String(c.id)), c);
                    }
                }

                // 観劇記録の読み込み
                const recordsSnap = await window.getDocs(window.collection(db, "users", uid, "records"));
                if (!recordsSnap.empty) {
                    recordsData = [];
                    recordsSnap.forEach(d => recordsData.push({ id: d.id, ...d.data() }));
                } else {
                    recordsData = JSON.parse(JSON.stringify(defaultRecords));
                    for (const r of recordsData) {
                        await window.setDoc(window.doc(db, "users", uid, "records", r.id), r);
                    }
                }
            } catch (e) {
                console.error("データロードエラー:", e);
            }
        }

        async function saveMasterToCloud() {
            const user = window.appAuth.currentUser;
            if (!user) return;
            await window.setDoc(window.doc(window.appDb, "users", user.uid, "config", "master"), {
                works: masterWorks,
                theaters: masterTheaters,
                roles: masterRoles
            });
        }

        async function saveCastToCloud(cast) {
            const user = window.appAuth.currentUser;
            if (!user) return;
            await window.setDoc(window.doc(window.appDb, "users", user.uid, "casts", String(cast.id)), cast);
        }

        async function saveRecordToCloud(record) {
            const user = window.appAuth.currentUser;
            if (!user) return;
            await window.setDoc(window.doc(window.appDb, "users", user.uid, "records", record.id), record);
        }

        async function deleteRecordFromCloud(recordId) {
            const user = window.appAuth.currentUser;
            if (!user) return;
            await window.deleteDoc(window.doc(window.appDb, "users", user.uid, "records", recordId));
        }

        // キャストの出演歴（history）をメモから再構築
        function rebuildCastHistory() {
            castsData.forEach(c => c.history = []);
            recordsData.forEach(rec => {
                if (!rec.memo) return;
                const lines = rec.memo.split('\n');
                lines.forEach(line => {
                    const parts = line.split('：');
                    if (parts.length === 2) {
                        const roleName = parts[0].trim();
                        const castName = parts[1].trim();
                        let foundCast = castsData.find(c => c.name === castName);
                        if (foundCast) {
                            if (!foundCast.history) foundCast.history = [];
                            const exists = foundCast.history.some(h => h.date === rec.date && h.work === rec.work && h.role === roleName);
                            if (!exists) {
                                foundCast.history.push({ date: rec.date, work: rec.work, role: roleName });
                            }
                        }
                    }
                });
            });
        }

        function switchScreen(screenName, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(`screen-${screenName}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');

            const titles = { home: 'ホーム / 登録', works: '作品一覧', casts: 'キャスト検索・詳細編集', settings: '設定' };
            document.getElementById('header-title').innerText = titles[screenName];

            if (screenName === 'works') renderWorksSummary();
            if (screenName === 'casts') renderCastList(castsData);
            if (screenName === 'settings') {
                renderMasterSettings();
                initRoleTargetSelect();
            }
        }

        function initApp() {
            rebuildCastHistory();

            const workSelect = document.getElementById('rec-work');
            workSelect.innerHTML = `<option value="" disabled selected>選択してください</option>` + masterWorks.map(w => `<option value="${w}">${w}</option>`).join('');

            const theaterSelect = document.getElementById('rec-theater');
            theaterSelect.innerHTML = `<option value="" disabled selected>選択してください</option>` + masterTheaters.map(t => `<option value="${t}">${t}</option>`).join('');
            
            document.getElementById('rec-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('rec-companion').value = '';
            document.getElementById('dynamic-cast-inputs').innerHTML = `<p style="color: #777; font-size: 0.85rem;">作品を選択すると、登録された役名がここに表示されます。</p>`;
        }

        function onWorkSelected() {
            const workName = document.getElementById('rec-work').value;
            const container = document.getElementById('dynamic-cast-inputs');
            
            const roles = masterRoles[workName] || [];
            if(roles.length === 0) {
                container.innerHTML = `<p style="color: #777; font-size: 0.85rem;">この作品の役名が「設定」に登録されていません。</p>`;
                return;
            }

            container.innerHTML = roles.map((role) => `
                <div class="cast-input-row">
                    <span style="width: 38%; font-size: 0.85rem; font-weight: bold; color: #444;">${role}</span>
                    <div class="autocomplete-wrapper" style="flex: 1; display: flex; gap: 5px;">
                        <input type="text" class="cast-name-input" data-role="${role}" placeholder="キャスト名を入力" oninput="onCastInput(this)" onkeydown="onCastInputKeydown(event, this)" autocomplete="off">
                        <button type="button" class="accent small" onclick="quickAddNewCast(this)">追加</button>
                        <div class="suggestions-box hidden"></div>
                    </div>
                </div>
            `).join('');
        }

        function onCastInput(inputElement) {
            const keyword = inputElement.value.trim().toLowerCase();
            const wrapper = inputElement.closest('.autocomplete-wrapper');
            const box = wrapper.querySelector('.suggestions-box');

            if(keyword === '') {
                box.classList.add('hidden');
                box.innerHTML = '';
                return;
            }

            const matched = castsData.filter(c => c.name.toLowerCase().includes(keyword) || (c.kana && c.kana.toLowerCase().includes(keyword)));

            if(matched.length === 0) {
                box.innerHTML = `<div class="suggestion-item" style="color: #888;">該当なし（右の「追加」で新規登録可能）</div>`;
                box.classList.remove('hidden');
                return;
            }

            box.innerHTML = matched.map((c) => `
                <div class="suggestion-item" tabindex="0" onclick="selectSuggestedCast(this, '${c.name}')" onkeydown="onSuggestionKeydown(event, '${c.name}', this)">
                    <strong>${c.name}</strong> <span style="font-size: 0.8rem; color: #666;">(${c.kana || '-'})</span>
                </div>
            `).join('');
            box.classList.remove('hidden');
        }

        function onCastInputKeydown(e, inputElement) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                const wrapper = inputElement.closest('.autocomplete-wrapper');
                const firstSuggestion = wrapper.querySelector('.suggestion-item');
                if (firstSuggestion) firstSuggestion.focus();
            }
        }

        function onSuggestionKeydown(e, castName, element) {
            if (e.key === 'Enter') {
                e.preventDefault();
                selectSuggestedCast(element, castName);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                const next = element.nextElementSibling;
                if (next) next.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prev = element.previousElementSibling;
                if (prev) {
                    prev.focus();
                } else {
                    const wrapper = element.closest('.autocomplete-wrapper');
                    wrapper.querySelector('.cast-name-input').focus();
                }
            }
        }

        function selectSuggestedCast(element, castName) {
            const wrapper = element.closest('.autocomplete-wrapper');
            const input = wrapper.querySelector('.cast-name-input');
            input.value = castName;
            wrapper.querySelector('.suggestions-box').classList.add('hidden');
            input.focus();
        }

        async function quickAddNewCast(btn) {
            const wrapper = btn.closest('.autocomplete-wrapper');
            const input = wrapper.querySelector('.cast-name-input');
            const nameVal = input.value.trim();

            if(!nameVal) {
                alert('キャスト名を入力してから「追加」を押してください。');
                return;
            }

            const exists = castsData.find(c => c.name === nameVal);
            if(exists) {
                alert(`「${nameVal}」はすでにキャスト一覧に登録されています。`);
                return;
            }

            const newCast = {
                id: castsData.length > 0 ? Math.max(...castsData.map(c => Number(c.id) || 0)) + 1 : 1,
                name: nameVal,
                kana: '-',
                birth: '',
                age: '',
                joined: '',
                intro: '新規追加されたキャスト',
                history: []
            };
            castsData.push(newCast);
            await saveCastToCloud(newCast);
            alert(`「${nameVal}」をキャスト一覧に新規登録しました！`);
            wrapper.querySelector('.suggestions-box').classList.add('hidden');
        }

        async function saveRecord(e) {
            e.preventDefault();
            const date = document.getElementById('rec-date').value;
            const work = document.getElementById('rec-work').value;
            const theater = document.getElementById('rec-theater').value;
            const companion = document.getElementById('rec-companion').value;

            if(!date || !work || !theater) {
                alert('観劇日、作品名、劇場名をすべて選択・入力してください。');
                return;
            }

            let memoLines = [];
            const rows = document.querySelectorAll('.cast-input-row');
            for(const row of rows) {
                const roleName = row.querySelector('span').innerText;
                const castNameInput = row.querySelector('.cast-name-input').value.trim();
                if(castNameInput) {
                    memoLines.push(`${roleName}：${castNameInput}`);
                    
                    let existingCast = castsData.find(c => c.name === castNameInput);
                    if(!existingCast) {
                        const newCast = {
                            id: castsData.length > 0 ? Math.max(...castsData.map(c => Number(c.id) || 0)) + 1 : 1,
                            name: castNameInput,
                            kana: '-',
                            birth: '',
                            age: '',
                            joined: '',
                            intro: '自動登録されたキャスト',
                            history: []
                        };
                        castsData.push(newCast);
                        await saveCastToCloud(newCast);
                    }
                }
            }

            const memo = memoLines.join('\n');
            const newRecord = { id: 'rec_' + Date.now(), date, work, theater, companion, memo };
            recordsData.push(newRecord);
            
            await saveRecordToCloud(newRecord);
            rebuildCastHistory();

            alert('観劇記録をクラウドに保存し、キャスト情報と自動連動させました！');
            document.getElementById('record-form').reset();
            initApp();
        }

        function handleWorkKeydown(e) { if (e.key === 'Enter') { e.preventDefault(); addMasterWork(); } }
        async function addMasterWork() {
            const input = document.getElementById('new-work-input');
            const val = input.value.trim();
            if(val && !masterWorks.includes(val)) {
                masterWorks.push(val);
                if(!masterRoles[val]) masterRoles[val] = [];
                input.value = '';
                await saveMasterToCloud();
                initApp();
                renderMasterSettings();
                initRoleTargetSelect();
            }
        }
        async function removeMasterWork(index) {
            masterWorks.splice(index, 1);
            await saveMasterToCloud();
            initApp();
            renderMasterSettings();
            initRoleTargetSelect();
        }

        function handleTheaterKeydown(e) { if (e.key === 'Enter') { e.preventDefault(); addMasterTheater(); } }
        async function addMasterTheater() {
            const input = document.getElementById('new-theater-input');
            const val = input.value.trim();
            if(val && !masterTheaters.includes(val)) {
                masterTheaters.push(val);
                input.value = '';
                await saveMasterToCloud();
                initApp();
                renderMasterSettings();
            }
        }
        async function removeMasterTheater(index) {
            masterTheaters.splice(index, 1);
            await saveMasterToCloud();
            initApp();
            renderMasterSettings();
        }

        function handleRoleKeydown(e) { if (e.key === 'Enter') { e.preventDefault(); addMasterRole(); } }
        async function addMasterRole() {
            const workName = document.getElementById('role-target-work').value;
            const input = document.getElementById('new-role-input');
            const val = input.value.trim();
            if(!masterRoles[workName]) masterRoles[workName] = [];
            if(val && !masterRoles[workName].includes(val)) {
                masterRoles[workName].push(val);
                input.value = '';
                await saveMasterToCloud();
                renderRoleSettings();
            }
        }
        async function removeMasterRole(workName, index) {
            masterRoles[workName].splice(index, 1);
            await saveMasterToCloud();
            renderRoleSettings();
        }

        async function resetToDefaultData() {
            if(confirm('クラウド上のデータも含めて初期状態にリセットします。本当によろしいですか？')) {
                masterWorks = [...defaultWorks];
                masterTheaters = [...defaultTheaters];
                masterRoles = JSON.parse(JSON.stringify(defaultRoles));
                castsData = JSON.parse(JSON.stringify(defaultCasts));
                recordsData = JSON.parse(JSON.stringify(defaultRecords));

                await saveMasterToCloud();
                const user = window.appAuth.currentUser;
                if (user) {
                    for (const c of castsData) {
                        await window.setDoc(window.doc(window.appDb, "users", user.uid, "casts", String(c.id)), c);
                    }
                    for (const r of recordsData) {
                        await window.setDoc(window.doc(window.appDb, "users", user.uid, "records", r.id), r);
                    }
                }
                initApp();
                alert('初期状態にリセットしました。');
                switchScreen('home', document.querySelector('.nav-item'));
            }
        }

        function onBirthInput(id) {
            const birthVal = document.getElementById(`edit-birth-${id}`).value.trim();
            const ageInput = document.getElementById(`edit-age-${id}`);
            if (!birthVal) { ageInput.value = ''; return; }

            const today = new Date();
            const currentYear = today.getFullYear();
            if (/^\d{4}$/.test(birthVal)) {
                ageInput.value = (currentYear - parseInt(birthVal, 10)) + '歳';
                return;
            }
            const parts = birthVal.split(/[-/]/);
            if (parts.length >= 3) {
                let age = currentYear - parseInt(parts[0], 10);
                ageInput.value = age + '歳';
            }
        }

        function toggleCastDetail(id) {
            document.getElementById(`cast-detail-${id}`).classList.toggle('hidden');
        }

        async function saveCastEdit(id) {
            const target = castsData.find(c => String(c.id) === String(id));
            if(!target) return;

            target.name = document.getElementById(`edit-name-${id}`).value.trim();
            target.kana = document.getElementById(`edit-kana-${id}`).value.trim();
            target.birth = document.getElementById(`edit-birth-${id}`).value.trim();
            target.age = document.getElementById(`edit-age-${id}`).value.trim();
            target.joined = document.getElementById(`edit-joined-${id}`).value.trim();
            target.intro = document.getElementById(`edit-intro-${id}`).value.trim();

            await saveCastToCloud(target);
            alert('キャストのプロフィール情報をクラウドに保存しました！');
            filterCasts();
        }

        function setSearchFilter(type, btn) {
            currentSearchFilter = type;
            document.querySelectorAll('.search-filters button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterCasts();
        }

        function filterCasts() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filtered = castsData.filter(c => {
                if(keyword === '') return true;
                if(currentSearchFilter === 'name') {
                    return c.name.toLowerCase().includes(keyword) || (c.kana && c.kana.toLowerCase().includes(keyword));
                } else if(currentSearchFilter === 'work') {
                    return c.history && c.history.some(h => h.work.toLowerCase().includes(keyword));
                } else if(currentSearchFilter === 'role') {
                    return c.history && c.history.some(h => h.role.toLowerCase().includes(keyword));
                } else {
                    const nameMatch = c.name.toLowerCase().includes(keyword) || (c.kana && c.kana.toLowerCase().includes(keyword));
                    const histMatch = c.history && c.history.some(h => h.work.toLowerCase().includes(keyword) || h.role.toLowerCase().includes(keyword));
                    return nameMatch || histMatch;
                }
            });
            renderCastList(filtered);
        }
    </script>
</body>
</html>
